<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfaaz Volunteer Assessment</title>
    <style>
        body { font-family: 'Helvetica Neue', sans-serif; background: #2d2722; color: #e8e0d4; text-align: center; padding: 2rem; }
        .card { max-width: 600px; margin: 0 auto; background: #352f29; padding: 2rem; border-radius: 8px; border: 1px solid rgba(168, 159, 147, 0.15); display: none; }
        .card.active { display: block; }
        button { display: block; width: 100%; margin: 10px 0; padding: 15px; background: transparent; border: 1px solid rgba(168,159,147,0.3); color: #e8e0d4; cursor: pointer; transition: 0.3s; }
        button:hover { border-color: #bd6f5d; background: rgba(189,111,93,0.1); }
        h2 { font-family: 'Cormorant Garamond', serif; }
    </style>
</head>
<body>
    <div id="screen-intro" class="card active">
        <h2>ALFAAZ COLLECTIVE</h2>
        <p>Before you fill a form, walk through a day at Alfaaz. There are no right or wrong answers - only yours.</p>
        <button onclick="startAssessment()">I understand and wish to proceed</button>
    </div>
    
    <div id="screen-sjt" class="card">
        <h2 id="sjt-title">Scenario</h2>
        <p id="sjt-text"></p>
        <div id="sjt-options"></div>
    </div>

    <div id="screen-form" class="card">
        <h2>Almost there.</h2>
        <input type="text" id="cand-name" placeholder="Name" style="width:100%; padding:10px; margin-bottom:10px;">
        <input type="email" id="cand-email" placeholder="Email" style="width:100%; padding:10px; margin-bottom:10px;">
        <input type="text" id="cand-phone" placeholder="Phone" style="width:100%; padding:10px; margin-bottom:10px;">
        <button onclick="submitAssessment()" id="submit-btn">Complete</button>
    </div>

    <script>
        const SCENARIOS = [
            {
                title: 'Scenario 1: The Missing Artwork',
                text: "It's the morning of 'Kaamil' - Alfaaz's exhibition. One artist's paintings haven't arrived. She's not answering her phone. The curator looks stressed.",
                options: [
                    { text: 'Quietly take over other setup tasks to free up the curator', tags: ['conscientiousness'] },
                    { text: 'Suggest rearranging the existing works to fill the gap', tags: ['creative'] },
                    { text: 'Sit with the curator for a moment, ask how they are feeling', tags: ['empathy'] },
                    { text: 'Start calling other Alfaaz members for backup artwork', tags: ['collaborative'] }
                ]
            },
            {
                title: 'Scenario 2: The Unhappy Artist',
                text: "An artist, Faizan, is upset his pieces are near the entrance. He wants a quiet corner. Another artist, Meher, is happy with her quiet spot and doesn't want to swap.",
                options: [
                    { text: 'Listen to Faizan fully, then talk to Meher separately to understand her perspective', tags: ['empathy'] },
                    { text: 'Explain to Faizan that placement was decided by the curator', tags: ['conscientiousness'] },
                    { text: 'Propose a creative compromise for Faizan', tags: ['creative'] },
                    { text: 'Let them work it out between themselves', tags: ['emotional'] }
                ]
            },
            {
                title: 'Scenario 3: The Last-Minute Visitor',
                text: "Thirty minutes before opening, a school teacher arrives with 15 students unannounced.",
                options: [
                    { text: 'Welcome them warmly, offer a quick walkthrough of ready pieces', tags: ['empathy', 'curiosity'] },
                    { text: 'Politely ask them to come back in an hour when we open', tags: ['conscientiousness'] },
                    { text: 'Check with the curator first to not overstep', tags: ['collaborative'] },
                    { text: 'Set up a temporary preview zone with a few pieces', tags: ['creative', 'motivation'] }
                ]
            },
            {
                title: 'Scenario 4: The Silent Voice',
                text: "During a philosophy debate, Zara keeps leaning forward to speak but pulls back.",
                options: [
                    { text: 'During a pause, gently say: "Zara, we would love to hear your thoughts."', tags: ['collaborative', 'empathy'] },
                    { text: 'After the session, approach Zara privately to encourage her', tags: ['emotional'] },
                    { text: 'Suggest the group try a round-robin format', tags: ['creative'] },
                    { text: 'Let it be, forcing it might make it worse', tags: ['emotional'] }
                ]
            },
            {
                title: 'Scenario 5: The Provocative Poem',
                text: "At a literature event, an audience member complains a poem is inappropriate. The poet looks shaken.",
                options: [
                    { text: 'Acknowledge the concern, affirm Alfaaz is for all voices', tags: ['emotional'] },
                    { text: 'Step in to support the poet and thank their courage', tags: ['empathy', 'motivation'] },
                    { text: 'Propose a brief pause to turn tension into dialogue', tags: ['collaborative', 'creative'] },
                    { text: 'Quietly check on the poet', tags: ['empathy'] }
                ]
            },
            {
                title: 'Scenario 6: The Children\'s Workshop',
                text: "At an art therapy workshop, one boy sits apart staring at a blank sheet.",
                options: [
                    { text: 'Sit near him quietly and doodle on your own paper', tags: ['empathy', 'emotional'] },
                    { text: 'Bring him a different material like clay', tags: ['creative', 'curiosity'] },
                    { text: 'Gently ask him what he would like to draw', tags: ['collaborative'] },
                    { text: 'Respect his space completely', tags: ['conscientiousness'] }
                ]
            },
            {
                title: 'Scenario 7: The Commitment Test',
                text: "You committed to setup a walk, but a close friend visits for one day only. You also feel burnt out.",
                options: [
                    { text: 'Show up, but leave early to see your friend', tags: ['conscientiousness', 'collaborative'] },
                    { text: 'Call the lead honestly and offer to cover next week', tags: ['collaborative', 'emotional'] },
                    { text: 'Go see your friend, you need the break', tags: ['emotional'] },
                    { text: 'Show up for the full setup and skip meeting your friend', tags: ['conscientiousness', 'motivation'] }
                ]
            }
        ];

        let currentIndex = 0;
        let sjtResponses = [];
        let SESSION_ID = 'SESS_' + Math.random().toString(36).substr(2, 9);

        function showScreen(id) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startAssessment() {
            showScreen('screen-sjt');
            renderScenario();
        }

        function renderScenario() {
            if (currentIndex >= SCENARIOS.length) {
                showScreen('screen-form');
                return;
            }
            const s = SCENARIOS[currentIndex];
            document.getElementById('sjt-title').textContent = s.title;
            document.getElementById('sjt-text').textContent = s.text;
            const optsDiv = document.getElementById('sjt-options');
            optsDiv.innerHTML = '';
            
            s.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.textContent = opt.text;
                btn.onclick = () => {
                    sjtResponses.push({ question: currentIndex + 1, answer: idx, tags: opt.tags });
                    currentIndex++;
                    renderScenario();
                };
                optsDiv.appendChild(btn);
            });
        }

        function submitAssessment() {
            const name = document.getElementById('cand-name').value || 'Applicant';
            const email = document.getElementById('cand-email').value || 'test@alfaaz.org';
            const phone = document.getElementById('cand-phone').value || '0000000000';
            const btn = document.getElementById('submit-btn');
            btn.textContent = 'Submitting...';
            btn.disabled = true;

            const payload = { sjtResponses: sjtResponses };

            fetch('/api/volunteers/assessment/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    assessment_id: SESSION_ID,
                    session_id: SESSION_ID,
                    identity: { name, email, phone }
                })
            }).then(() => {
                return fetch('/api/volunteers/assessment/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        assessment_id: SESSION_ID,
                        interests: '7-Parameter Assessment Completed',
                        notes: JSON.stringify(payload)
                    })
                });
            }).then(() => {
                btn.textContent = 'Success! Redirecting...';
                setTimeout(() => window.location.href = '/', 1500);
            }).catch(err => {
                console.error(err);
                btn.textContent = 'Error. Check console.';
            });
        }
    </script>
</body>
</html>
