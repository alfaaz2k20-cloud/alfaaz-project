<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfaaz Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-primary: #2d2722;
            --bg-secondary: #352f29;
            --text-primary: #e8e0d4;
            --text-secondary: #a89f93;
            --accent-gold: #bd6f5d;
            --grid-border: rgba(168, 159, 147, 0.15);
            --font-heading: 'Cormorant Garamond', serif;
            --font-body: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-body);
            min-height: 100vh;
        }

        h1, h2, h3 { font-family: var(--font-heading); font-weight: 400; }

        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }

        /* Login Screen */
        #login-screen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .form-input {
            background: transparent;
            border: 1px solid var(--grid-border);
            padding: 1rem;
            color: var(--text-primary);
            font-family: var(--font-body);
            margin-bottom: 1rem;
            width: 300px;
            outline: none;
        }
        .form-input:focus { border-color: var(--accent-gold); }
        .cta-btn {
            background: transparent;
            border: 1px solid var(--text-secondary);
            color: var(--text-primary);
            padding: 1rem 3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            width: 300px;
        }
        .cta-btn:hover { border-color: var(--accent-gold); color: var(--accent-gold); }

        /* Dashboard */
        #dashboard { display: none; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            border-bottom: 1px solid var(--grid-border);
            padding-bottom: 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
        }

        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--grid-border);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }
        .card-header {
            border-bottom: 1px solid var(--grid-border);
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }
        .name { font-size: 1.5rem; color: var(--accent-gold); font-family: var(--font-heading); }
        .date { font-size: 0.8rem; color: var(--text-secondary); }
        .contact { font-size: 0.9rem; margin-top: 0.5rem; display: flex; flex-direction: column; gap: 0.3rem;}
        .contact a { color: var(--text-primary); text-decoration: none; }
        
        .badge {
            display: inline-block;
            background: rgba(189, 111, 93, 0.2);
            color: var(--accent-gold);
            padding: 0.2rem 0.6rem;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            border: 1px solid var(--accent-gold);
        }

        .canvas-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 1rem;
        }
        
        .details h4 {
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-size: 0.9rem;
            text-transform: uppercase;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }
        .details p { font-size: 0.9rem; margin-bottom: 1rem; }

        .loading { text-align: center; font-size: 1.2rem; color: var(--accent-gold); margin-top: 3rem; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1 style="font-size: 3rem; margin-bottom: 2rem;">Alfaaz Portal</h1>
        <input type="password" id="pass-input" class="form-input" placeholder="Password" />
        <button id="login-btn" class="cta-btn">Enter</button>
        <p id="login-error" style="color: #ff6b6b; margin-top: 1rem; display: none;">Incorrect password.</p>
    </div>

    <div id="dashboard" class="container">
        <div class="header">
            <h1>Candidate Profiles</h1>
            <button class="cta-btn" style="width: auto; padding: 0.5rem 1.5rem;" onclick="loadData()">Refresh</button>
        </div>
        
        <div id="content-area"></div>
    </div>

    <script>
        const DASHBOARD_PASSWORD = 'alfaaz2026';
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz6qP3PVmN6my1lQn8KhkPGaJdYqFeUpOZdqOlf0I9NVJeL6pMEJyFk51FNbNx32jg/exec';

        const traits = ['empathy', 'conscientiousness', 'collaborative', 'emotional', 'curiosity', 'creative'];
        const maxScore = 15; // Rough max possible per trait

        document.getElementById('login-btn').addEventListener('click', () => {
            if(document.getElementById('pass-input').value === DASHBOARD_PASSWORD) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadData();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        });

        async function loadData() {
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = '<div class="loading">Loading candidates...</div>';

            try {
                if(APPS_SCRIPT_URL === 'https://script.google.com/macros/s/AKfycbz6qP3PVmN6my1lQn8KhkPGaJdYqFeUpOZdqOlf0I9NVJeL6pMEJyFk51FNbNx32jg/exec') {
                    contentArea.innerHTML = '<div class="loading">Please configure APPS_SCRIPT_URL in code.</div>';
                    return;
                }

                const res = await fetch(APPS_SCRIPT_URL);
                const data = await res.json();
                
                renderCards(data);
            } catch (err) {
                contentArea.innerHTML = `<div class="loading" style="color:red;">Error loading data: ${err.message}</div>`;
            }
        }

        function getRecommendation(data) {
            const emp = parseInt(data.empathy);
            const emot = parseInt(data.emotional);
            const crea = parseInt(data.creative);
            const curi = parseInt(data.curiosity);
            const collab = parseInt(data.collaborative);
            const cons = parseInt(data.conscientiousness);

            if(emp >= 5 && emot >= 5) return "Mental Health Outreach";
            if(crea >= 5 && curi >= 5) return "Exhibition / Tchandervar";
            if(collab >= 5 && cons >= 5) return "Event Management";
            if(curi >= 5 && emp >= 5) return "Philosophy / Literature Club";
            return "General Support";
        }

        function renderCards(data) {
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = '<div class="grid" id="cards-grid"></div>';
            const grid = document.getElementById('cards-grid');

            // Skip header row if exists, process from newest to oldest
            const rows = data.slice().reverse();

            rows.forEach((row, i) => {
                if(!row.Name) return; // Skip empty
                
                const card = document.createElement('div');
                card.className = 'card';
                
                const recommendation = getRecommendation(row);
                
                card.innerHTML = `
                    <div class="card-header">
                        <div class="name">${row.Name}</div>
                        <div class="date">${new Date(row.Timestamp).toLocaleString()}</div>
                        <div class="contact">
                            <a href="mailto:${row.Email}">${row.Email}</a>
                            <a href="tel:${row.Phone}">${row.Phone}</a>
                        </div>
                    </div>
                    <div class="badge">${row.DominantTrait}</div>
                    
                    <div class="canvas-container">
                        <canvas id="chart-${i}" width="200" height="200"></canvas>
                    </div>

                    <div class="details">
                        <h4>Recommended Placement</h4>
                        <p style="color: var(--accent-gold);">${recommendation}</p>

                        <h4>Interests</h4>
                        <p>${row.Interests || 'None selected'}</p>

                        <h4>Notes</h4>
                        <p>${row.Notes || 'None'}</p>
                    </div>
                `;
                
                grid.appendChild(card);
                
                // Draw Chart
                setTimeout(() => drawRadarChart(`chart-${i}`, [
                    parseInt(row.empathy)||0, 
                    parseInt(row.conscientiousness)||0, 
                    parseInt(row.collaborative)||0, 
                    parseInt(row.emotional)||0, 
                    parseInt(row.curiosity)||0, 
                    parseInt(row.creative)||0
                ]), 100);
            });
        }

        function drawRadarChart(canvasId, values) {
            const canvas = document.getElementById(canvasId);
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            const cw = canvas.width;
            const ch = canvas.height;
            const cx = cw / 2;
            const cy = ch / 2;
            const radius = Math.min(cx, cy) - 30; // padding for labels

            ctx.clearRect(0, 0, cw, ch);
            
            // Draw web
            const numAxes = traits.length;
            const numRings = 3;
            ctx.strokeStyle = 'rgba(168, 159, 147, 0.2)';
            ctx.lineWidth = 1;

            for(let i=1; i<=numRings; i++) {
                ctx.beginPath();
                for(let j=0; j<numAxes; j++) {
                    const angle = (Math.PI * 2 * j) / numAxes - Math.PI/2;
                    const r = (radius / numRings) * i;
                    const x = cx + r * Math.cos(angle);
                    const y = cy + r * Math.sin(angle);
                    if(j===0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.stroke();
            }

            // Draw axes & labels
            ctx.fillStyle = '#a89f93';
            ctx.font = '10px Inter';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const labels = ['EMP', 'CON', 'COL', 'EMO', 'CUR', 'CRE'];

            for(let j=0; j<numAxes; j++) {
                const angle = (Math.PI * 2 * j) / numAxes - Math.PI/2;
                
                // Axis
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + radius * Math.cos(angle), cy + radius * Math.sin(angle));
                ctx.stroke();

                // Label
                const lx = cx + (radius + 15) * Math.cos(angle);
                const ly = cy + (radius + 15) * Math.sin(angle);
                ctx.fillText(labels[j], lx, ly);
            }

            // Draw data
            ctx.beginPath();
            ctx.strokeStyle = '#bd6f5d';
            ctx.fillStyle = 'rgba(189, 111, 93, 0.4)';
            ctx.lineWidth = 2;

            for(let j=0; j<numAxes; j++) {
                const angle = (Math.PI * 2 * j) / numAxes - Math.PI/2;
                // Normalize value
                const normalized = Math.min(values[j] / maxScore, 1);
                const r = radius * normalized;
                const x = cx + r * Math.cos(angle);
                const y = cy + r * Math.sin(angle);
                
                if(j===0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }

        lucide.createIcons();
    </script>
</body>
</html>
